[project]
name = "emporio-agent"
version = "0.1.0"
description = "AI customer-service agent for Empório da Música - Artefact AI Engineer technical case"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]
