<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música - atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e9dfd2;        /* spruce-wood wallpaper */
    --ink: #2a2015;
    --header: #33241a;       /* dark walnut */
    --header-cream: #f4ece1;
    --bubble-out: #f2c879;   /* amber lacquer (customer) */
    --bubble-in: #ffffff;    /* agente */
    --accent: #a85b2a;
    --online: #3e9b6c;
    --muted: #7a6a58;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  /* signature: faint musical wallpaper */
  .stage {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    background:
      radial-gradient(circle at 12% 22%, rgba(42,32,21,.05) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 12%, rgba(42,32,21,.045) 0 2px, transparent 3px),
      var(--paper);
    position: relative;
  }
  .stage::before {
    content: "♪  ♫   ♪    ♬   ♪  ♫   ♪     ♬  ♪   ♫  ♪    ♬   ♪ ♫";
    position: absolute;
    inset: 56px 0 68px 0;
    font-size: 30px;
    letter-spacing: 26px;
    color: rgba(42, 32, 21, 0.05);
    overflow: hidden;
    white-space: nowrap;
    pointer-events: none;
    z-index: 0;
  }
  header {
    background: var(--header);
    color: var(--header-cream);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    z-index: 2;
  }
  .pick {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #d9a05b, var(--accent));
    clip-path: ellipse(50% 50% at 50% 42%);
    border-radius: 50%;
    flex: none;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 17px;
  }
  .who { flex: 1; min-width: 0; }
  .who .brand {
    font-family: Fraunces, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.15;
  }
  .who .status { font-size: 12.5px; opacity: .82; }
  .who .status::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--online);
    margin-right: 5px;
    vertical-align: 1px;
  }
  button.new-chat {
    background: transparent;
    color: var(--header-cream);
    border: 1px solid rgba(244,236,225,.4);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.new-chat:hover { background: rgba(244,236,225,.12); }
  button.new-chat:focus-visible, .composer button:focus-visible, .composer input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1;
  }
  .msg {
    max-width: 82%;
    padding: 8px 12px 6px;
    border-radius: var(--radius);
    position: relative;
    box-shadow: 0 1px 1px rgba(42,32,21,.14);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg time {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    text-align: right;
    margin-top: 3px;
  }
  .msg.in {
    align-self: flex-start;
    background: var(--bubble-in);
    border-top-left-radius: 4px;
  }
  .msg.out {
    align-self: flex-end;
    background: var(--bubble-out);
    border-top-right-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    box-shadow: none;
    color: #8c3a2b;
    font-size: 13.5px;
    text-align: center;
  }
  .hello {
    align-self: center;
    text-align: center;
    margin: auto 12%;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 480px;
  }
  .hello strong { color: var(--ink); font-size: 16.5px; }
  .dots {
    align-self: flex-start;
    background: var(--bubble-in);
    border-radius: var(--radius);
    border-top-left-radius: 4px;
    padding: 12px 16px;
    display: none;
    gap: 5px;
  }
  .dots.on { display: inline-flex; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
  .composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    z-index: 2;
  }
  .composer input {
    flex: 1;
    border: 0;
    border-radius: 999px;
    padding: 12px 18px;
    font: inherit;
    background: #fff;
    box-shadow: 0 1px 2px rgba(42,32,21,.18);
  }
  .composer button {
    width: 46px; height: 46px;
    border: 0;
    border-radius: 50%;
    background: var(--header);
    color: var(--header-cream);
    font-size: 19px;
    cursor: pointer;
    flex: none;
  }
  .composer button:disabled { opacity: .45; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    .dots i { animation: none; opacity: .6; }
    .msg, .dots { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="pick" aria-hidden="true">♪</div>
    <div class="who">
      <div class="brand">Empório da Música</div>
      <div class="status">Agente · atendimento virtual · <em>sua música começa aqui</em></div>
    </div>
    <button class="new-chat" id="newChat" type="button">Nova conversa</button>
  </header>

  <main id="chat" aria-live="polite" aria-label="Conversa com o agente">
    <div class="hello" id="hello">
      <strong>Oi! Eu sou o agente de atendimento</strong><br>
      Da Empório da Música, em Campo Grande.
      Pergunte sobre instrumentos, preços e promoções - ou sobre o seu pedido.
    </div>
  </main>

  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></div>

  <form class="composer" id="form">
    <input id="input" type="text" placeholder="Digite sua mensagem…" autocomplete="off" autofocus>
    <button id="send" type="submit" aria-label="Enviar mensagem">➤</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const hello = document.getElementById("hello");
  const dots = document.getElementById("dots");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  const sessionIdKey = "emporio.session";
  let sessionId = localStorage.getItem(sessionIdKey) || newSession();

  function newSession() {
    const id = "web-" + crypto.randomUUID().slice(0, 8);
    localStorage.setItem(sessionIdKey, id);
    return id;
  }

  function addMsg(text, side) {
    hello?.remove();
    const div = document.createElement("div");
    div.className = "msg " + side;
    if (side === "in") {
      for (const part of text.split(/(\*\*[^*]+\*\*)/g)) {
        if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
          const b = document.createElement("b");
          b.textContent = part.slice(2, -2);
          div.appendChild(b);
        } else if (part) {
          div.appendChild(document.createTextNode(part));
        }
      }
    } else {
      div.textContent = text;
    }
    const time = document.createElement("time");
    time.textContent = new Date().toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
    div.appendChild(time);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function busy(on) {
    dots.classList.toggle("on", on);
    send.disabled = on;
    input.disabled = on;
    if (!on) input.focus();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    addMsg(message, "out");
    busy(true);
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, message}),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      addMsg(data.reply, "in");
    } catch (err) {
      const div = document.createElement("div");
      div.className = "msg error";
      div.textContent = "Não consegui enviar a mensagem. Verifica se o servidor está rodando e tenta de novo.";
      chat.appendChild(div);
    } finally {
      busy(false);
    }
  });

  document.getElementById("newChat").addEventListener("click", async () => {
    await fetch("/api/reset", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sessionId, message: ""}),
    }).catch(() => {});
    chat.innerHTML = "";
    chat.appendChild(hello);
    sessionId = newSession();
    input.focus();
  });
</script>
</body>
</html>
